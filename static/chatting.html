<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SC AX 상담</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #16202f;
      --muted: #6c7686;
      --line: #e3e8ef;
      --surface: #ffffff;
      --canvas: #f4f7fb;
      --brand: #1463e6;
      --brand-dark: #0c4dbb;
      --assistant: #eef3f9;
      --danger: #c9362b;
      --shadow: 0 18px 55px rgba(26, 48, 82, 0.12);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 18% 0%, rgba(20, 99, 230, 0.1), transparent 30rem),
        var(--canvas);
      color: var(--ink);
      font-family: Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    button, textarea { font: inherit; }

    .app {
      width: min(920px, 100%);
      height: 100%;
      min-height: 540px;
      margin: 0 auto;
      padding: 24px;
    }

    .chat-shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      height: 100%;
      overflow: hidden;
      border: 1px solid rgba(213, 221, 232, 0.85);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--line);
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .mark {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(145deg, #2277f2, #0d4ebd);
      color: white;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(20, 99, 230, 0.24);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.025em;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #12a86b;
      content: "";
    }

    .clear-button {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--muted);
      padding: 8px 11px;
      cursor: pointer;
    }

    .clear-button:hover { color: var(--ink); border-color: #c7d0dc; }

    .messages {
      overflow-y: auto;
      padding: 28px 24px 18px;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      margin-bottom: 18px;
      animation: appear 180ms ease-out;
    }

    .message-row.user { justify-content: flex-end; }

    .bubble {
      max-width: min(680px, 84%);
      padding: 13px 16px;
      border-radius: 18px;
      line-height: 1.65;
      letter-spacing: -0.012em;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .assistant .bubble {
      border-bottom-left-radius: 6px;
      background: var(--assistant);
    }

    .user .bubble {
      border-bottom-right-radius: 6px;
      background: var(--brand);
      color: white;
    }

    .error .bubble {
      border: 1px solid #f3c8c4;
      background: #fff2f0;
      color: var(--danger);
    }

    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 48px;
    }

    .typing i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #8995a5;
      animation: pulse 1.1s infinite ease-in-out;
    }

    .typing i:nth-child(2) { animation-delay: 120ms; }
    .typing i:nth-child(3) { animation-delay: 240ms; }

    .composer-wrap {
      padding: 14px 18px 18px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.97);
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 8px 8px 8px 15px;
      border: 1px solid #ced6e1;
      border-radius: 17px;
      background: var(--surface);
      transition: border-color 150ms, box-shadow 150ms;
    }

    .composer:focus-within {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(20, 99, 230, 0.11);
    }

    textarea {
      width: 100%;
      max-height: 140px;
      min-height: 30px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      line-height: 1.55;
    }

    textarea::placeholder { color: #98a2b0; }

    .send-button {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      place-items: center;
      border: 0;
      border-radius: 13px;
      background: var(--brand);
      color: white;
      cursor: pointer;
      transition: background 150ms, transform 150ms;
    }

    .send-button:hover:not(:disabled) {
      background: var(--brand-dark);
      transform: translateY(-1px);
    }

    .send-button:disabled { cursor: default; opacity: 0.45; }

    .hint {
      margin: 8px 4px 0;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 60%, 100% { opacity: 0.35; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-3px); }
    }

    @media (max-width: 640px) {
      .app { padding: 0; }
      .chat-shell { border: 0; border-radius: 0; }
      header { padding: 16px; }
      .messages { padding: 22px 14px 12px; }
      .composer-wrap { padding: 12px; }
      .bubble { max-width: 90%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="chat-shell" aria-label="SC AX 상담 채팅">
      <header>
        <div class="identity">
          <div class="mark" aria-hidden="true">AI</div>
          <div>
            <h1>SC AX 상담</h1>
            <div class="status">상담 가능</div>
          </div>
        </div>
        <button class="clear-button" id="clear" type="button">새 대화</button>
      </header>

      <div class="messages" id="messages" role="log" aria-live="polite"></div>

      <div class="composer-wrap">
        <form class="composer" id="chat-form">
          <textarea
            id="question"
            rows="1"
            maxlength="10000"
            placeholder="궁금한 내용을 입력하세요"
            aria-label="질문 입력"
          ></textarea>
          <button class="send-button" id="send" type="submit" aria-label="전송">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
        <p class="hint">Enter로 전송 · Shift+Enter로 줄바꿈</p>
      </div>
    </section>
  </main>

  <script>
    const messagesElement = document.querySelector("#messages");
    const form = document.querySelector("#chat-form");
    const input = document.querySelector("#question");
    const sendButton = document.querySelector("#send");
    const clearButton = document.querySelector("#clear");
    const basePath = window.location.pathname.replace(/\/chatting\/?$/, "");
    const chatEndpoint = `${basePath}/chat`;
    const pageParameters = new URLSearchParams(window.location.search);
    const employeeId = pageParameters.get("employeeId") || "";
    const conversation = [];
    let pending = false;
    let sessionId = sessionStorage.getItem("scax-chat-session") || crypto.randomUUID();
    sessionStorage.setItem("scax-chat-session", sessionId);

    function addMessage(role, text, extraClass = "") {
      const row = document.createElement("div");
      row.className = `message-row ${role} ${extraClass}`.trim();
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      row.appendChild(bubble);
      messagesElement.appendChild(row);
      messagesElement.scrollTop = messagesElement.scrollHeight;
      return row;
    }

    function addTyping() {
      const row = document.createElement("div");
      row.className = "message-row assistant";
      const bubble = document.createElement("div");
      bubble.className = "bubble typing";
      bubble.setAttribute("aria-label", "답변 작성 중");
      bubble.innerHTML = "<i></i><i></i><i></i>";
      row.appendChild(bubble);
      messagesElement.appendChild(row);
      messagesElement.scrollTop = messagesElement.scrollHeight;
      return row;
    }

    function resizeInput() {
      input.style.height = "auto";
      input.style.height = `${Math.min(input.scrollHeight, 140)}px`;
    }

    function setPending(value) {
      pending = value;
      input.disabled = value;
      sendButton.disabled = value;
      clearButton.disabled = value;
    }

    async function submitQuestion(question) {
      addMessage("user", question);
      conversation.push({ role: "user", content: question });
      const typing = addTyping();
      setPending(true);

      try {
        const response = await fetch(chatEndpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question,
            overrideConfig: { sessionId, employeeId },
            history: conversation.slice(-20),
          }),
        });
        const payload = await response.json().catch(() => null);
        if (!response.ok) {
          throw new Error(payload?.detail?.message || `HTTP ${response.status}`);
        }
        const text = payload?.data?.text;
        if (payload?.code !== 0 || typeof text !== "string") {
          throw new Error("서버 응답 형식이 올바르지 않습니다.");
        }
        typing.remove();
        addMessage("assistant", text);
        conversation.push({ role: "assistant", content: text });
      } catch (error) {
        typing.remove();
        addMessage(
          "assistant",
          `답변을 불러오지 못했습니다. ${error.message || "잠시 후 다시 시도해 주세요."}`,
          "error",
        );
      } finally {
        setPending(false);
        input.focus();
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question || pending) return;
      input.value = "";
      resizeInput();
      submitQuestion(question);
    });

    input.addEventListener("input", resizeInput);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    clearButton.addEventListener("click", () => {
      conversation.length = 0;
      sessionId = crypto.randomUUID();
      sessionStorage.setItem("scax-chat-session", sessionId);
      messagesElement.replaceChildren();
      addMessage("assistant", "안녕하세요. 궁금한 내용을 편하게 질문해 주세요.");
      input.focus();
    });

    addMessage("assistant", "안녕하세요. 궁금한 내용을 편하게 질문해 주세요.");
    input.focus();
  </script>
</body>
</html>
