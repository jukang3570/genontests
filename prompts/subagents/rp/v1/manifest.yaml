version: "1.4.0"
released_at: "2026-08-19"
agent_code: "RP"

prompt_files:
  - "system.md"
  - "scenarios/01_rp_documents.md"
  - "scenarios/02_apartment_management_fee_rp_eligibility.md"
  - "scenarios/04_composite_conversion.md"

model:
  temperature: 0

parameter_definitions:
  rag_query:
    description: "마스터 보정 질문에서 RP 문서 조회 요청만 분리해 만든 독립적인 Databricks 검색 질문. 원래 의미를 유지하고 새로운 조건을 추가하지 않음"
  keywords:
    value_type: "string_list"
    min_items: 1
    max_items: 10
    description: "RP_DOCUMENT_SEARCH의 Databricks 하이브리드 검색에 사용할 핵심 업무 키워드 배열. RP 문서 조회가 아닌 세부 시나리오에는 이 파라미터를 사용하지 않음"
  address:
    description: "아파트명 또는 읍면동 기반 검색값. 질문에 없으면 null"
  closing_year_month:
    description: "마감작업년월. 반드시 YYYYMM 형식이며 질문에 없으면 null"
    pattern: "^[0-9]{6}$"
  reference_date:
    description: "기준일자. 반드시 YYYYMMDD 형식이며 질문에 없으면 null"
    pattern: "^[0-9]{8}$"

scenarios:
  - code: "RP_DOCUMENTS"
    name: "RP 업무 문서 조회"
    description: "RP 관련 신청 기준, 절차, 제한사항 및 운영 정책을 문서에서 조회"
    details:
      - code: "RP_DOCUMENT_SEARCH"
        name: "RP 업무 기준 및 정책 조회"
        description: "RP 관련 업무 기준과 정책을 Databricks 승인 문서에서 검색하여 안내"
        parameters:
          - "rag_query"
          - "keywords"
        recommended_questions:
          - "RP 신청 절차를 알려줘"
          - "RP 연결 제한 조건을 알려줘"

  - code: "APARTMENT_MANAGEMENT_FEE_RP_ELIGIBILITY"
    name: "아파트관리비 RP 연결 가능 단지 조회"
    description: "아파트명 또는 읍면동을 기준으로 관리비 RP 연결 가능 단지를 조회"
    details:
      - code: "APARTMENT_RP_LIST"
        name: "아파트관리비 RP 연결 가능 목록 조회"
        description: "검색값이 포함된 아파트 중 관리비 자동납부 연결 가능 단지를 조회"
        parameters:
          - "address"
        recommended_questions:
          - "강남구 RP 연결 가능 아파트를 찾아줘"
          - "아파트관리비 RP 신청 절차를 알려줘"
        # action과 MCP 입력은 app/mcp/scenarios/rp.py의
        # _apartment_rp_address_action(), apartment_rp_list()에서 제어한다.

  - code: "COMPOSITE_CONVERSION"
    name: "복합환산조회"
    description: "복합판매 구분코드별 환산점수·실적 건수와 환산 미반영 내역 조회"
    details:
      - code: "COMPOSITE_CONVERSION_SCORE"
        name: "복합판매 구분코드별 환산점수 및 실적 건수 조회"
        description: "복합판매 구분코드별 환산점수와 실적 건수를 조회"
        parameters:
          - "closing_year_month"
          - "reference_date"
        recommended_questions:
          - "복합환산에서 제외된 내역도 알려줘"
          - "지난달 복합환산 점수와 비교해줘"
      - code: "COMPOSITE_CONVERSION_EXCLUDED"
        name: "환산 미반영 내역 조회"
        description: "자동이체 미연결, 자동차 연계, 탈회, 삼성전자 매출 등 환산 미반영 내역 조회"
        parameters:
          - "closing_year_month"
        recommended_questions:
          - "복합판매 구분별 환산점수도 보여줘"
          - "지난달 환산 미반영 내역과 비교해줘"
