    name: "개인회원 입회 자격기준"
    description: "신규회원·외국인·미성년자 개인회원 입회 자격기준 조회"
    details:
      - code: "NEW_MEMBER_QUALIFICATION"
        name: "신규회원 입회 자격기준"
