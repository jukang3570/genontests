      - "NEW_MEMBER"
      - "FOREIGNER"
      - "MINOR"
  search_query:
    description: "선택한 자격기준 시나리오의 Databricks 하이브리드 검색에 사용할 자연어 검색문. 모든 시나리오에서 반드시 질문의 업무 의미를 유지해 작성"

scenarios:
